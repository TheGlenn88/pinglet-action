name: "Pinglet Notify"
description: "Send a push notification to a Pinglet topic: deploy results, CI failures, release announcements, straight to your phone"
author: "Pinglet"
branding:
  icon: "bell"
  color: "blue"

inputs:
  key:
    description: "Pinglet API key (pinglet_...). Store it as a repository secret."
    required: true
  topic:
    description: "Topic address as namespace/name, e.g. acme/deploys. Created on first publish."
    required: true
  message:
    description: "Notification body."
    required: true
  title:
    description: "Notification title. Defaults to the topic name."
    required: false
    default: ""
  level:
    description: "Display severity: info, success, warning or error."
    required: false
    default: ""
  priority:
    description: "Delivery intrusiveness: silent, normal or urgent. Urgent breaks through DND."
    required: false
    default: ""
  badges:
    description: 'JSON object of up to 3 short pills for the notification card, e.g. {"env":"prod"}.'
    required: false
    default: ""
  data:
    description: "JSON object of metadata key/value pairs for the detail sheet (Pro plans)."
    required: false
    default: ""
  dry-run:
    description: "Set to 'true' to print the payload without sending (used by CI)."
    required: false
    default: "false"

outputs:
  response:
    description: "The publish response JSON (message id, share URL, delivery tally)."
    value: ${{ steps.publish.outputs.response }}

runs:
  using: "composite"
  steps:
    - id: publish
      shell: bash
      env:
        PINGLET_KEY: ${{ inputs.key }}
        PINGLET_TOPIC: ${{ inputs.topic }}
        PINGLET_MESSAGE: ${{ inputs.message }}
        PINGLET_TITLE: ${{ inputs.title }}
        PINGLET_LEVEL: ${{ inputs.level }}
        PINGLET_PRIORITY: ${{ inputs.priority }}
        PINGLET_BADGES: ${{ inputs.badges }}
        PINGLET_DATA: ${{ inputs.data }}
        PINGLET_DRY_RUN: ${{ inputs.dry-run }}
      run: |
        set -euo pipefail

        case "$PINGLET_TOPIC" in
          */*) ;;
          *)
            echo "::error::topic must be 'namespace/name' (got '$PINGLET_TOPIC')"
            exit 1
            ;;
        esac

        badges_json="${PINGLET_BADGES:-}"
        [ -z "$badges_json" ] && badges_json=null
        data_json="${PINGLET_DATA:-}"
        [ -z "$data_json" ] && data_json=null

        payload=$(jq -cn \
          --arg message "$PINGLET_MESSAGE" \
          --arg title "$PINGLET_TITLE" \
          --arg level "$PINGLET_LEVEL" \
          --arg priority "$PINGLET_PRIORITY" \
          --argjson badges "$badges_json" \
          --argjson data "$data_json" \
          '{message: $message}
           + (if $title != "" then {title: $title} else {} end)
           + (if $level != "" then {level: $level} else {} end)
           + (if $priority != "" then {priority: $priority} else {} end)
           + (if $badges != null then {badges: $badges} else {} end)
           + (if $data != null then {data: $data} else {} end)')

        if [ "$PINGLET_DRY_RUN" = "true" ]; then
          echo "dry-run payload: $payload"
          echo "response=$payload" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        if ! response=$(curl -sS --fail-with-body \
            --retry 3 --retry-all-errors --max-time 30 \
            -X POST "https://pinglet.dev/$PINGLET_TOPIC" \
            -H "Authorization: Bearer $PINGLET_KEY" \
            -H "Content-Type: application/json" \
            -H "User-Agent: pinglet-action/v1" \
            -d "$payload"); then
          echo "::error title=Pinglet publish failed::$response"
          exit 1
        fi

        echo "response=$response" >> "$GITHUB_OUTPUT"
        echo "Published to $PINGLET_TOPIC"
